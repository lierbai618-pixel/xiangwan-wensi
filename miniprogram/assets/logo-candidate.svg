<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144" role="img" aria-label="向晚问思 logo 候选">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8b04b" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#e8b04b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e8b04b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#9b2f25"/>
      <stop offset="55%" stop-color="#d8692f"/>
      <stop offset="100%" stop-color="#f2c14e"/>
    </linearGradient>
  </defs>

  <!-- 圆角方形底，米色（与 app 导航栏 #efe4cf 一致） -->
  <rect x="0" y="0" width="144" height="144" rx="30" fill="#efe4cf"/>

  <!-- 禅圆 enso：深绯 #9b2f25，留口有笔意 -->
  <circle cx="72" cy="72" r="46" fill="none" stroke="#9b2f25" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="266 26" transform="rotate(40 72 72)" opacity="0.9"/>
  <circle cx="72" cy="72" r="46" fill="none" stroke="#9b2f25" stroke-width="3"
          stroke-linecap="round" stroke-dasharray="266 26" transform="rotate(40 72 72)" opacity="0.25"/>

  <!-- 火焰柔光 -->
  <circle cx="72" cy="70" r="30" fill="url(#glow)"/>

  <!-- 烛焰 -->
  <path d="M72 90 C61 80 63 64 72 50 C81 64 83 80 72 90 Z" fill="url(#flame)"/>
  <path d="M72 85 C67 79 68 70 72 61 C76 70 77 79 72 85 Z" fill="#f7e2a0" opacity="0.85"/>

  <!-- 烛芯小点 -->
  <circle cx="72" cy="91" r="2.4" fill="#6e211a"/>
</svg>
