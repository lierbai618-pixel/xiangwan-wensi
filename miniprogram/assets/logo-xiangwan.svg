<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144" role="img" aria-label="向晚问思 logo">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e89a5c"/>
      <stop offset="0.55" stop-color="#c9663a"/>
      <stop offset="1" stop-color="#9b2f25"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9663a" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#c9663a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 米色圆角底（沿用 app 导航栏色） -->
  <rect width="144" height="144" rx="30" fill="#efe4cf"/>

  <!-- 落日光晕 -->
  <circle cx="72" cy="72" r="48" fill="url(#glow)"/>

  <!-- 落日 -->
  <circle cx="72" cy="72" r="31" fill="url(#sun)"/>

  <!-- 落日中的“问”：开口环（未完成的思索） -->
  <circle cx="72" cy="72" r="14" fill="none" stroke="#fbeede" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="64 24" transform="rotate(35 72 72)"/>

  <!-- 远山：两道平缓山丘，落日半沉 -->
  <path d="M0 92 Q34 80 72 90 T144 88 L144 144 L0 144 Z" fill="#cdb791"/>
  <path d="M0 108 Q42 96 80 106 T144 104 L144 144 L0 144 Z" fill="#b89b78"/>
</svg>
