<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 564" width="100%" role="img">
  <title>问道 通用 AI 助手升级架构</title>
  <desc>问题经意图理解层分类，按 skip/optional/use 决策是否检索经典知识库，经典仅作论证依据，最终由 LLM 按动态格式生成，并接入最近10轮上下文与危机最高优先级。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="40" y="28" font-family="sans-serif" font-size="15" font-weight="500" fill="#26215C">问道 · 通用 AI 助手升级架构</text>
  <g>
    <rect x="270" y="40" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">用户问题</text>
  </g>
  <g>
    <rect x="225" y="110" width="230" height="58" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="340" y="132" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">意图理解层 Intent</text>
    <text x="340" y="152" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">classifyIntent → type / domain / policy</text>
  </g>
  <g>
    <rect x="460" y="110" width="180" height="48" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
    <text x="550" y="128" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#501313">危机信号</text>
    <text x="550" y="146" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#A32D2D">最高优先级 · 跳过检索</text>
  </g>
  <path d="M455 134 H460" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="3 3" fill="none"/>
  <g>
    <rect x="250" y="192" width="180" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="340" y="210" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">知识增强决策</text>
    <text x="340" y="228" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">skip · optional · use</text>
  </g>
  <g>
    <rect x="55" y="282" width="215" height="58" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="162" y="304" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">② RAG 条件检索</text>
    <text x="162" y="324" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">optional: 强相关(lex≥12)才取</text>
  </g>
  <g>
    <rect x="55" y="372" width="215" height="58" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="162" y="394" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">③ 经典素材</text>
    <text x="162" y="414" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">论证依据 · 非必引 · 禁编造</text>
  </g>
  <g>
    <rect x="360" y="300" width="230" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="475" y="322" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">④ LLM 综合生成</text>
    <text x="475" y="342" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">多模型自动切换</text>
    <text x="475" y="360" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">服务端 qwen-plus 等</text>
  </g>
  <g>
    <rect x="360" y="400" width="230" height="72" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="475" y="420" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">⑤ 动态输出格式</text>
    <text x="475" y="440" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">technical / general</text>
    <text x="475" y="458" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">philosophy / emotion</text>
  </g>
  <g>
    <rect x="360" y="500" width="230" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="475" y="522" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">前端渲染 + 引用卡</text>
  </g>
  <g>
    <rect x="55" y="500" width="215" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="162" y="522" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">历史上下文 · 最近 10 轮</text>
  </g>
  <path d="M340 84 V110" stroke="#185FA5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M340 168 V192" stroke="#185FA5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M340 238 V268 H162 V282" stroke="#185FA5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="200" y="258" font-family="sans-serif" font-size="12" fill="#185FA5">use / optional</text>
  <path d="M430 215 H500 V300" stroke="#185FA5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="440" y="256" font-family="sans-serif" font-size="12" fill="#185FA5">skip</text>
  <path d="M162 340 V372" stroke="#185FA5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M270 401 H330 V332 H360" stroke="#185FA5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M475 364 V400" stroke="#185FA5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M475 472 V500" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M270 522 H330 V332 H360" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="278" y="430" font-family="sans-serif" font-size="12" fill="#5F5E5A">10 轮</text>
</svg>
