# ============================================================
# SearXNG settings.yml —— 向晚问思（WenDao）国内检索实例
# 部署约束（Phase Q2-9 / Q2-5-B）：
#   · 仅启用【国内搜索引擎】，零跨境数据出境（PIPL 合规核心）。
#   · 禁用 Bing 国际 / Google / DuckDuckGo / Tavily / SerpAPI 等任何跨境源。
#   · 实例仅监听 127.0.0.1，由同机 Caddy 反向代理对外（见 Caddyfile）。
#   · 公网访问须经 Caddy 的 Bearer Token 校验（与云函数 SEARXNG_API_KEY 一致）。
#
# ⚠️ 部署前必做：
#   1) 生成 secret_key：  openssl rand -hex 32
#      将下方 "REPLACE_WITH_GENERATED_KEY" 替换为生成的 64 位十六进制串。
#   2) 本文件为只读挂载（:ro），改完重启容器生效：
#      docker compose -f docker-compose.yml restart searxng
# ============================================================

general:
  instance_name: "向晚问思-Search"
  contact_url: ""
  enable_metrics: false

search:
  safe_search: 1                 # 1=中（过滤成人内容）
  autocomplete: ""
  default_lang: "zh"
  formats:
    - json                       # 开放 JSON API（domesticFreeSearch.js 使用）

server:
  port: 8080
  bind_address: "127.0.0.1"      # 仅本机，公网经 Caddy
  secret_key: "REPLACE_WITH_GENERATED_KEY"
  limiter: false                 # 内部实例，由 Bearer Token + 云函数配额保护
  image_proxy: false
  method: "POST"
  default_http_headers:
    X-Content-Type-Options: "nosniff"
    X-Frame-Options: "DENY"
    Referrer-Policy: "no-referrer"

ui:
  default_locale: "zh"
  theme: "simple"

# ------------------------------------------------------------
# 引擎清单（唯一可信来源）
#   · 仅列出国内源；SearXNG 仅在 engines 列表中的引擎会被加载，
#     未列出的（bing/google/ddg/...）即便镜像内置也【不会启用】。
#   · 360 搜索在 SearXNG 中的引擎名是 "so"（so.com）。
# ------------------------------------------------------------
engines:
  # —— 严格国内 Web 检索（默认启用，零跨境）——
  - name: baidu
    engine: baidu
    disabled: false

  - name: sogou
    engine: sogou
    disabled: false

  - name: "360"
    engine: so
    disabled: false

  # —— 可选（需 PIPL 评估）：维基系服务器位于境外，开启即不再严格零跨境 ——
  # 若坚持严格零跨境，请保持以下两项注释掉。
  # - name: wikidata
  #   engine: wikidata
  # - name: wikipedia
  #   engine: wikipedia
  #   language: zh

# 关闭所有内置插件（减少外呼面）
plugins: []
