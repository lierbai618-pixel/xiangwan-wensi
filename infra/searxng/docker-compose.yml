# ============================================================
# docker-compose.yml —— 向晚问思 SearXNG 国内检索实例
# 配套：settings.yml（仅国内引擎） + Caddyfile（HTTPS + Bearer 鉴权）
#
# 启动：
#   docker compose up -d
# 仅暴露 127.0.0.1:8080 给本机 Caddy；公网 80/443 由 Caddy 处理。
# ============================================================
version: "3.8"

services:
  searxng:
    image: searxng/searxng:latest
    container_name: wendao-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      # 替换为你已 ICP 备案的域名；仅用于生成正确的 OpenSearch/重定向
      - SEARXNG_BASE_URL=https://search.example.com
    # 资源上限，避免单实例拖垮 CVM
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  caddy:
    image: caddy:2
    container_name: wendao-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - searxng

volumes:
  caddy_data:
  caddy_config:
